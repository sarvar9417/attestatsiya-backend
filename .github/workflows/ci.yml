name: CI

on:
  pull_request:
  push:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: https://example.invalid
      SUPABASE_SERVICE_KEY: ci-placeholder-key
      AUTH_REDIRECT_URL: http://localhost:3001
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Secret scan
        run: npm run check:secrets
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Typecheck (api entry)
        run: npx tsc -p tsconfig.api.json
      - name: Unit tests
        run: npx vitest run
